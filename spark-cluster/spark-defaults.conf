# Spark Configuration for Cluster Mode
# EMR-aligned settings for distributed streaming processing

# Cluster Configuration
spark.master                           spark://spark-master:7077
spark.submit.deployMode                client

# Resource Allocation (EMR m5.xlarge equivalent)
spark.driver.memory                    1g
spark.driver.cores                     1
spark.executor.memory                  1g
spark.executor.cores                   1
spark.executor.instances               2

# Dynamic Allocation (EMR-style)
spark.dynamicAllocation.enabled        false
spark.dynamicAllocation.minExecutors   1
spark.dynamicAllocation.maxExecutors   4

# Memory Management (optimized for streaming)
spark.driver.maxResultSize             512m
spark.driver.memoryFraction            0.8
spark.executor.memoryFraction          0.8
spark.sql.adaptive.enabled             true
spark.sql.adaptive.coalescePartitions.enabled  true

# Streaming Optimizations
spark.sql.streaming.checkpointLocation.deleteOnExit    true
spark.sql.streaming.forceDeleteTempCheckpointLocation  true
spark.sql.streaming.maxBatchesToRetainInMemory         2
spark.sql.streaming.minBatchesToRetain                 1

# Serialization (EMR standard)
spark.serializer                       org.apache.spark.serializer.KryoSerializer
spark.kryo.unsafe                      true
spark.kryo.registrationRequired        false

# Shuffle and Parallelism
spark.default.parallelism              4
spark.sql.shuffle.partitions           4
spark.sql.adaptive.coalescePartitions.minPartitionNum  1

# Network and I/O
spark.network.timeout                  300s
spark.sql.broadcastTimeout            300
spark.rpc.askTimeout                   120s
spark.rpc.lookupTimeout               120s

# Garbage Collection (EMR optimized)
spark.driver.extraJavaOptions          -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
spark.executor.extraJavaOptions        -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication

# Kafka Integration
spark.jars.packages                    org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-avro_2.12:3.5.1
spark.jars.ivy                         /home/streaming/.ivy2

# Logging
spark.eventLog.enabled                 true
spark.eventLog.dir                     /tmp/spark-events
spark.history.ui.port                  18080

# EMR-specific optimizations
spark.sql.adaptive.localShuffleReader.enabled         true
spark.sql.adaptive.skewJoin.enabled                   true
spark.sql.adaptive.advisory.partitionSizeInBytes      128MB
spark.sql.files.maxPartitionBytes                     128MB