version: '3.8'
services:
  streaming-producer:
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./requirements-streaming.txt:/app/requirements-streaming.txt:ro
    environment:
      - ALPHA_VANTAGE_MOCK_MODE=true
      - ALPHA_VANTAGE_API_KEY=mock_api_key_for_development
      - PRODUCTION_INTERVAL_SECONDS=60
      - STOCK_SYMBOLS=AAPL,GOOGL,MSFT,AMZN,TSLA,META,NVDA,NFLX,AMD,INTC
      - LOG_LEVEL=INFO

  streaming-processor:
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./requirements-streaming.txt:/app/requirements-streaming.txt:ro
    environment:
      - ALPHA_VANTAGE_MOCK_MODE=true
      - LOG_LEVEL=INFO

  kafka-connect:
    volumes:
      - ./config/kafka-connect:/etc/kafka-connect/config:ro
