version: 2

sources:
  - name: streaming
    database: stockmarket
    schema: streaming
    description: "Raw streaming data from Kafka Connect to Redshift"
    tables:
      - name: processed_stock_prices_stream
        description: "Processed stock prices data from Phase 3 producer via Kafka Connect"
        columns:
          - name: kafka_key
            description: "Kafka message key (typically stock symbol)"
            tests:
              - not_null
          - name: kafka_value
            description: "JSON payload containing processed stock prices data from Phase 3 producer"
            tests:
              - not_null
          - name: kafka_partition
            description: "Kafka partition number for this message"
          - name: kafka_offset
            description: "Kafka message offset within partition"
          - name: kafka_timestamp
            description: "Kafka message timestamp (used for incremental processing)"
            tests:
              - not_null
          - name: refresh_time
            description: "Timestamp when record was written to Redshift by Kafka Connect"
            
      - name: processed_technical_indicators_stream
        description: "Technical indicators calculated by Phase 3 producer via Kafka Connect"
        columns:
          - name: kafka_key
            description: "Kafka message key (typically stock symbol)"
            tests:
              - not_null
          - name: kafka_value
            description: "JSON payload containing technical indicators from Phase 3 producer"
            tests:
              - not_null
          - name: kafka_partition
            description: "Kafka partition number for this message"
          - name: kafka_offset
            description: "Kafka message offset within partition"
          - name: kafka_timestamp
            description: "Kafka message timestamp (used for incremental processing)"
            tests:
              - not_null
          - name: refresh_time
            description: "Timestamp when record was written to Redshift by Kafka Connect"
            
      - name: processed_trading_volume_stream
        description: "Trading volume analytics from Phase 3 producer via Kafka Connect"
        columns:
          - name: kafka_key
            description: "Kafka message key (typically stock symbol)"
            tests:
              - not_null
          - name: kafka_value
            description: "JSON payload containing trading volume analytics from Phase 3 producer"
            tests:
              - not_null
          - name: kafka_partition
            description: "Kafka partition number for this message"
          - name: kafka_offset
            description: "Kafka message offset within partition"
          - name: kafka_timestamp
            description: "Kafka message timestamp (used for incremental processing)"
            tests:
              - not_null
          - name: refresh_time
            description: "Timestamp when record was written to Redshift by Kafka Connect"

models:
  - name: stg_processed_stock
    description: "Parsed processed stock prices with JSON extraction (Phase 3 schema)"
    columns:
      - name: record_id
        description: "Unique record identifier (MD5 hash)"
        tests:
          - not_null
          - unique
      - name: symbol
        description: "Stock ticker symbol"
        tests:
          - not_null
      - name: timestamp
        description: "Stock quote timestamp"
        tests:
          - not_null
      - name: current_price
        description: "Current stock price"
      - name: open_price
        description: "Opening price for the period"
      - name: high_price
        description: "Highest price for the period"
      - name: low_price
        description: "Lowest price for the period"
      - name: volume
        description: "Trading volume"
      - name: sma_5min
        description: "5-minute Simple Moving Average"
      - name: sma_20min
        description: "20-minute Simple Moving Average"
      - name: price_trend_5min
        description: "5-minute price trend direction"
      - name: price_volatility
        description: "Price volatility measure"
      - name: trading_session
        description: "Trading session identifier"
      - name: vwap
        description: "Volume Weighted Average Price"
      - name: price_change_abs
        description: "Absolute price change"
      - name: price_momentum
        description: "Price momentum indicator"
      - name: producer_timestamp
        description: "Producer processing timestamp"
      - name: processing_timestamp
        description: "Data processing timestamp"
      - name: data_quality_score
        description: "Data quality assessment score"
      - name: kafka_timestamp
        description: "Kafka message timestamp for incremental processing"
        tests:
          - not_null
      - name: dbt_loaded_at
        description: "DBT processing timestamp"
        
  - name: stg_technical_indicators
    description: "Parsed technical indicators from Phase 3 producer"
    columns:
      - name: record_id
        description: "Unique record identifier (MD5 hash)"
        tests:
          - not_null
          - unique
      - name: symbol
        description: "Stock ticker symbol"
        tests:
          - not_null
      - name: timestamp
        description: "Indicator calculation timestamp"
        tests:
          - not_null
      - name: rsi_14
        description: "14-period Relative Strength Index (0-100)"
      - name: macd
        description: "MACD indicator value"
      - name: macd_signal
        description: "MACD signal line value"
      - name: macd_histogram
        description: "MACD histogram value"
      - name: bollinger_upper
        description: "Bollinger Band upper boundary"
      - name: bollinger_lower
        description: "Bollinger Band lower boundary"
      - name: bollinger_middle
        description: "Bollinger Band middle line (SMA)"
      - name: producer_timestamp
        description: "Producer processing timestamp"
      - name: processing_timestamp
        description: "Data processing timestamp"
      - name: data_quality_score
        description: "Data quality assessment score"
      - name: kafka_timestamp
        description: "Kafka message timestamp for incremental processing"
        tests:
          - not_null
      - name: dbt_loaded_at
        description: "DBT processing timestamp"
        
  - name: stg_trading_volume
    description: "Parsed trading volume analytics from Phase 3 producer"
    columns:
      - name: record_id
        description: "Unique record identifier (MD5 hash)"
        tests:
          - not_null
          - unique
      - name: symbol
        description: "Stock ticker symbol"
        tests:
          - not_null
      - name: timestamp
        description: "Volume analysis timestamp"
        tests:
          - not_null
      - name: volume
        description: "Trading volume"
      - name: volume_ma_5min
        description: "5-minute volume moving average"
      - name: volume_ma_20min
        description: "20-minute volume moving average"
      - name: volume_trend
        description: "Volume trend direction"
      - name: volume_anomaly
        description: "Volume anomaly detection flag"
      - name: volume_ratio
        description: "Volume ratio metric"
      - name: volume_weighted_price
        description: "Volume weighted price"
      - name: volume_category
        description: "Volume categorization"
      - name: producer_timestamp
        description: "Producer processing timestamp"
      - name: processing_timestamp
        description: "Data processing timestamp"
      - name: kafka_timestamp
        description: "Kafka message timestamp for incremental processing"
        tests:
          - not_null
      - name: dbt_loaded_at
        description: "DBT processing timestamp"
