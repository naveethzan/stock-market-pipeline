name: 'stock_market_dbt'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'stock_market'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  stock_market_dbt:
    # Config indicated by + and applies to all files under models/example/
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      dimensions:
        +materialized: table
        +schema: marts
      facts:
        +materialized: incremental
        +schema: marts
        +on_schema_change: 'append_new_columns'

# Redshift-specific configurations
query-comment: |
  {{ node.name }} | DBT Stock Market Pipeline

# Seeds configuration
seeds:
  stock_market_dbt:
    +schema: seeds

# Test configurations  
tests:
  +store_failures: true

# Add snapshot configuration (Phase 4.4)
snapshots:
  stock_market_dbt:
    +target_database: stockmarket
    +target_schema: marts
    +materialized: snapshot
    +strategy: check
    +check_cols: ['company_name', 'exchange', 'market_cap']
    +invalidate_hard_deletes: true
