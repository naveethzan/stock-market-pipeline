# Kafka Connect base configuration
bootstrap.servers=kafka:9092
group.id=streaming-pipeline-connect-cluster

# Converter settings for JSON data
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Avro converter settings (for schema registry integration)
key.converter.avro=io.confluent.connect.avro.AvroConverter
value.converter.avro=io.confluent.connect.avro.AvroConverter
key.converter.avro.schema.registry.url=http://schema-registry:8081
value.converter.avro.schema.registry.url=http://schema-registry:8081

# Internal topic settings
offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
offset.storage.partitions=25

config.storage.topic=connect-configs
config.storage.replication.factor=1

status.storage.topic=connect-status
status.storage.replication.factor=1
status.storage.partitions=5

# Flush settings
offset.flush.interval.ms=10000

# Plugin path for connectors
plugin.path=/usr/share/java,/usr/share/confluent-hub-components

# REST API settings
rest.port=8083
rest.host.name=0.0.0.0

# Error handling
errors.tolerance=all
errors.deadletterqueue.topic.name=connect-dlq
errors.deadletterqueue.topic.replication.factor=1
errors.deadletterqueue.context.headers.enable=true

# Logging
connect.log4j.root.loglevel=INFO
connect.log4j.loggers=org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR