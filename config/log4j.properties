# Set everything to be logged to the console
log4j.rootCategory=INFO, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Settings to quiet third-party logs
log4j.logger.org.spark_project.jetty=WARN
log4j.logger.org.spark_project.jetty.util.component.AbstractLifeCycle=ERROR
log4j.logger.org.apache.spark=WARN
log4j.logger.org.apache.hadoop=WARN
log4j.logger.io.netty=ERROR

# SPARK-9183: Settings to avoid annoying messages when using the second argument to SparkContext#setLogLevel
log4j.logger.org.apache.spark.repl.SparkIMain$exprTyper=INFO
log4j.logger.org.apache.spark.repl.SparkILoop$SparkILoopInterpreter=INFO
log4j.logger.org.apache.spark.sql.SparkSession=INFO

# Parquet related logging
log4j.logger.parquet=ERROR

# For Spark Streaming
log4j.logger.org.apache.spark.streaming=WARN

# For AWS SDK
log4j.logger.com.amazonaws=ERROR
log4j.logger.org.apache.http=ERROR

# For Kafka
log4j.logger.org.apache.kafka=WARN

# For Zookeeper
log4j.logger.org.apache.zookeeper=ERROR
