# Logging configuration for streaming pipeline
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  detailed:
    format: '%(asctime)s [%(levelname)s] %(name)s [%(filename)s:%(lineno)d] [%(funcName)s] - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  json:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s", "module": "%(module)s", "function": "%(funcName)s", "line": %(lineno)d}'
    datefmt: '%Y-%m-%dT%H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/streaming_pipeline.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/streaming_pipeline_errors.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  json_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/streaming_pipeline.json
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  streaming_pipeline:
    level: DEBUG
    handlers: [console, file, error_file, json_file]
    propagate: false

  streaming_pipeline.producers:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  streaming_pipeline.processors:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  kafka:
    level: INFO
    handlers: [console, file]
    propagate: false

  pyspark:
    level: WARN
    handlers: [console, file]
    propagate: false

  py4j:
    level: WARN
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]