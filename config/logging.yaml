# Logging configuration for stock market pipeline
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: logs/pipeline.log

loggers:
  stock_market_pipeline:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  stock_market_pipeline.ingestion:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  stock_market_pipeline.processing:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  stock_market_pipeline.storage:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  kafka:
    level: WARN
    handlers: [console]
    propagate: false

  pyspark:
    level: WARN
    handlers: [console]
    propagate: false

  py4j:
    level: WARN
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console, file]